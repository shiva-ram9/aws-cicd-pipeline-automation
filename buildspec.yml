version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting application validation"
      - chmod +x scripts/*.sh tests/*.sh
  build:
    commands:
      - bash tests/validate.sh
  post_build:
    commands:
      - echo "Build and validation completed successfully"

artifacts:
  files:
    - appspec.yml
    - app/**/*
    - scripts/**/*
  discard-paths: no
